# Deploys the calculator in app/ to GitHub Pages on every push to main that touches it.
name: Deploy calculator

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check calculator against the Python engine
        run: node tests/app_check.js
      - name: Stamp the commit into asset URLs (so browsers never mix old and new files)
        run: sed -i "s/__VERSION__/${GITHUB_SHA::7}/g" app/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
